<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sansh AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#fbf9f5] text-[#1a1a1a] font-['Plus_Jakarta_Sans',sans-serif] h-screen flex flex-col justify-between overflow-hidden">
    
    <!-- Splash Screen Animation -->
    <div id="splash-screen" class="fixed inset-0 bg-[#fbf9f5] z-50 flex flex-col items-center justify-between py-12 transition-opacity duration-700">
        <div></div>
        <div class="flex flex-col items-center space-y-4 animate-pulse">
            <div class="w-12 h-12 flex items-center justify-center">
                <svg viewBox="0 0 100 100" class="w-full h-full text-[#da6c47]">
                    <path d="M50 10 L50 90 M10 50 L90 50 M22 22 L78 78 M22 78 L78 22" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="50" cy="50" r="16" fill="currentColor"/>
                </svg>
            </div>
            <span class="font-['Instrument_Serif',serif] text-3xl tracking-wide text-[#1a1a1a]">Sansh</span>
        </div>
        <div class="text-[11px] tracking-[0.25em] text-[#8c887f] uppercase font-medium">
            ANTHROP\C
        </div>
    </div>

    <!-- Top Header -->
    <header class="flex items-center justify-between px-6 py-4">
        <button class="text-[#59554d] hover:text-[#1a1a1a] transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"></path></svg>
        </button>
        <button class="text-[#59554d] hover:text-[#1a1a1a] transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path></svg>
        </button>
    </header>

    <!-- Main Hero Greeting Area -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 text-center pb-16">
        <div class="mb-6 transform transition-all duration-500 hover:scale-105">
            <div class="w-14 h-14 mx-auto mb-5 flex items-center justify-center">
                <svg viewBox="0 0 100 100" class="w-full h-full text-[#da6c47]">
                    <path d="M50 10 L50 90 M10 50 L90 50 M22 22 L78 78 M22 78 L78 22" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
                    <circle cx="50" cy="50" r="16" fill="currentColor"/>
                </svg>
            </div>
            <h1 id="greeting" class="font-['Instrument_Serif',serif] text-4xl md:text-5xl text-[#1a1a1a] tracking-tight">Good evening, Sansh</h1>
        </div>
    </main>

    <!-- Floating Bottom Input Bar -->
    <div class="p-4 max-w-xl w-full mx-auto mb-6">
        <div class="bg-white/90 backdrop-blur-md border border-[#e3dfd6] rounded-3xl p-3 shadow-sm transition-all focus-within:shadow-md">
            <!-- Text Input Row -->
            <div class="flex items-center px-2 py-1">
                <input type="text" placeholder="Chat with Sansh..." class="flex-1 bg-transparent border-none outline-none text-sm text-[#1a1a1a] placeholder-[#9c968c]">
            </div>
            
            <!-- Controls Row -->
            <div class="flex items-center justify-between pt-2 px-1 border-t border-[#f2ede4] mt-2">
                <div class="flex items-center space-x-2">
                    <button class="w-8 h-8 rounded-full bg-[#f2ede4] flex items-center justify-center text-[#59554d] hover:bg-[#e6e1d6] transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                    </button>
                    <div class="bg-[#f2ede4] text-[#332f29] text-xs font-medium px-3 py-1.5 rounded-full flex items-center space-x-1.5 cursor-pointer hover:bg-[#e6e1d6] transition">
                        <span>Sonnet 5.5 Medium</span>
                        <svg class="w-3 h-3 text-[#76736d]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button class="w-8 h-8 rounded-full bg-transparent flex items-center justify-center text-[#76736d] hover:text-[#1a1a1a] transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"></path></svg>
                    </button>
                    <button class="w-9 h-9 rounded-full bg-[#1a1a1a] text-white flex items-center justify-center hover:bg-[#332f29] transition shadow-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v13.5m0 0l-4.5-4.5m4.5 4.5l4.5-4.5M3 20.25h18"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
