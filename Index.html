<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Clean Serif & Sans Serif Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-[#f7f6f2]">

    <!-- ========================================== -->
    <!-- 1. LAUNCH / SPLASH SCREEN                  -->
    <!-- ========================================== -->
    <section id="splash-view" class="fixed inset-0 z-50 flex flex-col justify-between items-center py-12 px-6 bg-[#f7f6f2]">
        <div></div> <!-- Spacer -->
        
        <!-- Center Logo & Branding -->
        <div class="flex flex-col items-center pulse-logo">
            <!-- Starburst Logo SVG -->
            <div class="w-24 h-24 mb-3 flex items-center justify-center">
                <svg width="86" height="86" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5 L50 95 M5 50 L95 50 M18 18 L82 82 M18 82 L82 18" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                    <path d="M50 16 L50 84 M16 50 L84 50" stroke="#d96738" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M50 30 Q50 50 70 50 Q50 50 50 70 Q50 50 30 50 Q50 50 50 30 Z" fill="#d96738" stroke="#1a1a1a" stroke-width="1.5"/>
                </svg>
            </div>
            <!-- Brand Name -->
            <h1 class="serif-text text-3xl italic text-[#d96738]">Super AI</h1>
        </div>

        <!-- Footer Credit -->
        <div class="serif-text text-sm tracking-widest text-gray-500 uppercase">
            Santosh
        </div>
    </section>

    <!-- ========================================== -->
    <!-- 2. MAIN CHAT & DASHBOARD INTERFACE         -->
    <!-- ========================================== -->
    <section id="main-view" class="hidden h-full flex-col justify-between p-4 max-w-lg mx-auto w-full">
        <!-- Top Navigation -->
        <header class="flex justify-between items-center py-2">
            <button class="p-2 text-gray-700">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="w-7 h-7 rounded-full bg-[#d96738] text-white flex items-center justify-center font-medium text-xs">
                S
            </div>
        </header>

        <!-- Dynamic Chat Stream Area -->
        <div id="chat-stream" class="flex-1 flex flex-col overflow-y-auto my-2">
            <div id="hero-section" class="my-auto flex flex-col items-center justify-center">
                <div class="w-14 h-14 mb-3">
                    <svg width="56" height="56" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 5 L50 95 M5 50 L95 50 M18 18 L82 82 M18 82 L82 18" stroke="#1a1a1a" stroke-width="2"/>
                        <path d="M50 30 Q50 50 70 50 Q50 50 50 70 Q50 50 30 50 Q50 50 50 30 Z" fill="#d96738" stroke="#1a1a1a" stroke-width="1.5"/>
                    </svg>
                </div>
                <!-- Dynamic Greeting Display -->
                <h2 id="greeting-text" class="serif-text text-4xl text-[#1a1a1a] text-center font-normal"></h2>
            </div>
        </div>

        <!-- Floating Chat Input Bar -->
        <footer class="pb-2">
            <div class="relative flex items-center bg-white rounded-2xl border border-gray-300 shadow-sm px-4 py-3">
                <input id="chat-input" type="text" placeholder="Message Super AI..." class="w-full bg-transparent focus:outline-none text-base text-gray-800 pr-10">
                <button id="send-btn" class="absolute right-3 bg-[#d96738] text-white p-2 rounded-xl flex items-center justify-center">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </footer>
    </section>

    <!-- Main Engine Script -->
    <script src="app.js"></script>
</body>
</html>
